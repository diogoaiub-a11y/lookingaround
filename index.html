<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VibingEcho</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="hero">
        <div class="hero-copy">
          <p class="eyebrow">VibingEcho</p>
          <h1>Find songs with the same vibe.</h1>
          <p>
            Describe the moment, memory, or feeling you want. Add a song only
            if you want VibingEcho to use it as a sonic reference.
          </p>
        </div>

        <form class="search-panel" id="recommendation-form">
          <label class="vibe-prompt-label" for="vibe-prompt">
            What do you want to feel?
            <textarea
              id="vibe-prompt"
              rows="5"
              placeholder="Ex: songs to drive at midnight thinking about the future, something animated for a party with friends, or music to miss my ex without crying too much"
            ></textarea>
          </label>

          <label for="music-query">Reference song, optional</label>
          <div class="search-row">
            <input
              id="music-query"
              name="query"
              type="search"
              autocomplete="off"
              placeholder="Optional: Sweater Weather The Neighbourhood"
            />
            <button type="submit">Find vibe</button>
          </div>

          <div class="controls">
            <label>
              Store country
              <select id="country">
                <option value="BR" selected>Brazil</option>
                <option value="US">United States</option>
                <option value="PT">Portugal</option>
                <option value="GB">United Kingdom</option>
                <option value="ES">Spain</option>
              </select>
            </label>

            <label>
              Vibe
              <select id="mood">
                <option value="auto" selected>Detect automatically</option>
                <option value="melancholic">Melancholic</option>
                <option value="romantic">Romantic</option>
                <option value="energetic">Energetic</option>
                <option value="calm">Calm</option>
                <option value="dark">Dark</option>
                <option value="bright">Bright</option>
                <option value="dreamy">Dreamy</option>
                <option value="nostalgic">Nostalgic</option>
                <option value="groovy">Groovy</option>
                <option value="aggressive">Aggressive</option>
                <option value="sensual">Sensual</option>
                <option value="cinematic">Cinematic</option>
                <option value="lonely">Lonely</option>
                <option value="euphoric">Euphoric</option>
              </select>
            </label>

            <label class="range-control">
              Match style
              <input id="similarity" type="range" min="0" max="100" value="72" />
              <span id="similarity-label">closer sound</span>
            </label>

            <label>
              Category
              <select id="category">
                <option value="pop">Pop</option>
                <option value="r&b">R&B / Soul</option>
                <option value="rock">Rock</option>
                <option value="hip-hop">Hip-Hop</option>
                <option value="dance">Dance / Electronic</option>
                <option value="indie">Indie / Alternative</option>
                <option value="latin">Latin</option>
                <option value="funk">Funk</option>
                <option value="disco">Disco</option>
                <option value="new-wave">New Wave</option>
                <option value="synth-pop">Synth Pop</option>
                <option value="trap">Trap</option>
                <option value="reggaeton">Reggaeton</option>
                <option value="mpb">MPB</option>
                <option value="jazz">Jazz</option>
                <option value="blues">Blues</option>
                <option value="folk">Folk</option>
                <option value="acoustic">Acoustic</option>
                <option value="ambient">Ambient</option>
                <option value="metal">Metal</option>
                <option value="punk">Punk</option>
                <option value="k-pop">K-Pop</option>
                <option value="soundtrack">Soundtrack</option>
                <option value="calm">Calm</option>
                <option value="dark">Dark</option>
                <option value="party">Party</option>
                <option value="workout">Workout</option>
                <option value="night-drive">Night Drive</option>
                <option value="heartbreak">Heartbreak</option>
              </select>
            </label>

          </div>
          <div class="quick-actions">
            <button id="vibe-prompt-button" type="button">Find by description</button>
            <button id="category-button" type="button">Explore category</button>
            <button id="surprise-button" type="button">Surprise me</button>
          </div>
        </form>
      </section>

      <section class="status-area" aria-live="polite">
        <div class="progress-wrap" id="progress-wrap" hidden>
          <div class="progress-meta">
            <span id="progress-label">Preparing</span>
            <strong id="progress-percent">0%</strong>
          </div>
          <div class="progress-track">
            <span id="progress-bar"></span>
          </div>
        </div>
        <p id="status-text">Ready to find a vibe.</p>
      </section>

      <section class="library-section">
        <div>
          <h2>Recently searched</h2>
          <div id="history-list" class="chip-list"></div>
        </div>
        <div>
          <h2>Favorites</h2>
          <div id="favorites-list" class="chip-list"></div>
        </div>
      </section>

      <section class="seed-section" id="seed-section" hidden>
        <h2>Found reference</h2>
        <div id="seed-card" class="seed-card"></div>
      </section>

      <section class="results-section">
        <div class="section-heading">
          <h2>Recommendations</h2>
          <div class="section-actions">
            <button id="spotify-playlist" type="button" title="Create a Spotify playlist">
              Add all to Spotify
            </button>
            <button id="clear-cache" type="button" title="Clear local cache">
              Clear cache
            </button>
          </div>
        </div>
        <div id="results" class="results-grid"></div>
      </section>
    </main>

    <template id="track-card-template">
      <article class="track-card">
        <img class="cover" alt="" />
        <div class="track-info">
          <div class="match-row">
            <span class="match-score"></span>
            <span class="mood-tag"></span>
          </div>
          <h3></h3>
          <p class="artist"></p>
          <p class="why"></p>
          <div class="vibe-bars"></div>
          <div class="actions">
            <audio controls preload="none"></audio>
            <div class="card-buttons">
              <button class="more-like" type="button">More like this</button>
              <button class="favorite" type="button">Save</button>
              <a target="_blank" rel="noreferrer">Open track</a>
            </div>
          </div>
          <small>Preview and cover from Deezer when available.</small>
        </div>
      </article>
    </template>

    <script src="app.js?v=vibingecho-vibe-prompt-v48"></script>
  </body>
</html>
