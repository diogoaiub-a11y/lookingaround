<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VibingEcho</title>
    <link rel="preconnect" href="https://itunes.apple.com" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="hero">
        <div class="hero-copy">
          <p class="eyebrow">VibingEcho</p>
          <h1>Find songs with the same vibe.</h1>
          <p>
            Type an artist or song and get similar tracks pulled automatically
            from the public iTunes catalog.
          </p>
        </div>

        <form class="search-panel" id="recommendation-form">
          <label for="music-query">Song and artist/band</label>
          <div class="search-row">
            <input
              id="music-query"
              name="query"
              type="search"
              autocomplete="off"
              placeholder="Ex: Beat It Michael Jackson, Sweater Weather The Neighbourhood"
              required
            />
            <button type="submit">Recommend</button>
          </div>

          <div class="controls">
            <label>
              Store country
              <select id="country">
                <option value="BR" selected>Brazil</option>
                <option value="US">United States</option>
                <option value="PT">Portugal</option>
                <option value="GB">United Kingdom</option>
                <option value="ES">Spain</option>
              </select>
            </label>

            <label>
              Vibe
              <select id="mood">
                <option value="auto" selected>Detect automatically</option>
                <option value="melancholic">Melancholic</option>
                <option value="romantic">Romantic</option>
                <option value="energetic">Energetic</option>
                <option value="calm">Calm</option>
                <option value="dark">Dark</option>
                <option value="bright">Bright</option>
              </select>
            </label>

          </div>
        </form>
      </section>

      <section class="status-area" aria-live="polite">
          <p id="status-text">Ready to find a vibe.</p>
      </section>

      <section class="seed-section" id="seed-section" hidden>
        <h2>Found reference</h2>
        <div id="seed-card" class="seed-card"></div>
      </section>

      <section class="results-section">
        <div class="section-heading">
          <h2>Recommendations</h2>
          <button id="clear-cache" type="button" title="Clear local cache">
            Clear cache
          </button>
        </div>
        <div id="results" class="results-grid"></div>
      </section>
    </main>

    <template id="track-card-template">
      <article class="track-card">
        <img class="cover" alt="" />
        <div class="track-info">
          <div class="match-row">
            <span class="match-score"></span>
            <span class="mood-tag"></span>
          </div>
          <h3></h3>
          <p class="artist"></p>
          <p class="why"></p>
          <div class="actions">
            <audio controls preload="none"></audio>
            <a target="_blank" rel="noreferrer">Abrir no iTunes</a>
          </div>
          <small>Preview provided courtesy of iTunes.</small>
        </div>
      </article>
    </template>

    <script src="app.js?v=vibingecho-audio-rank-v5"></script>
  </body>
</html>
